name: PRO CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # ── .NET Build & Test ──────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test (.NET)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore PRO.sln

      - name: Build
        run: dotnet build PRO.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PRO.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'

  # ── PWA Build & Audit ──────────────────────────
  pwa-build:
    runs-on: ubuntu-latest
    name: PWA Build & Audit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: src/PRO.Admin.Web
        run: npm ci

      - name: Audit
        working-directory: src/PRO.Admin.Web
        run: npm audit --production

      - name: Build
        working-directory: src/PRO.Admin.Web
        run: npm run build

      - name: Upload PWA dist
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-dist
          path: src/PRO.Admin.Web/dist/

  # ── MAUI Mobile Build (manual / tag only) ──────
  # 注意：MAUI 构建需要 maui workload，CI runner 上开销大，
  # 默认不在每次 push 时构建。可通过 tag `mobile-*` 触发。
  # 本地构建命令见 src/PRO.Mobile/README.md
  mobile-build:
    if: startsWith(github.ref, 'refs/tags/mobile-')
    runs-on: windows-latest
    name: MAUI Mobile Build (Android)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore src/PRO.Mobile/PRO.Mobile.csproj

      - name: Build Android
        run: dotnet publish src/PRO.Mobile/PRO.Mobile.csproj -c Release -f net8.0-android -o ./publish/mobile/android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pro-mobile-android
          path: publish/mobile/android/*.apk
