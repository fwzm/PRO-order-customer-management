name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '24.x'

jobs:
  build-and-test:
    name: Restore, build, and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/PRO.Admin.Web/package-lock.json

      - name: Restore
        run: dotnet restore PRO.sln

      - name: Build
        run: dotnet build PRO.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test PRO.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Install Web dependencies
        run: npm ci --prefix src/PRO.Admin.Web

      - name: Audit Web dependencies
        run: npm audit --prefix src/PRO.Admin.Web --audit-level=low

      - name: Build Web PWA
        run: npm run build --prefix src/PRO.Admin.Web

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/test-results.trx'
